<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>apkmh - تحميل العاب وتطبيقات اندرويد</title>
    <style>
        :root {
            --primary-color: #00c853;
            --primary-dark: #009624;
            --bg-color: #f4f6f8;
            --white: #ffffff;
            --text-main: #333333;
            --text-light: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* الهيدر */
        header {
            background-color: var(--white);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo span {
            color: var(--text-main);
        }

        .search-bar input {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            outline: none;
            width: 250px;
            transition: 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--primary-color);
        }

        /* المحتوى الرئيسي */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--text-main);
            border-right: 4px solid var(--primary-color);
            padding-right: 10px;
        }

        /* شبكة الألعاب والتطبيقات */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: var(--white);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .app-card img {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .app-card h3 {
            font-size: 15px;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .app-card p {
            font-size: 12px;
            color: var(--text-light);
        }

        /* صفحة تفاصيل اللعبة */
        .game-details {
            display: none;
            background: var(--white);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-header {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
            padding-bottom: 25px;
        }

        .game-header img {
            width: 130px;
            height: 130px;
            border-radius: 25px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .game-info h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .game-info p {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* الأزرار */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-download {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 200, 83, 0.3);
            transition: background 0.3s;
            display: inline-block;
            text-align: center;
        }

        .btn-download:hover {
            background-color: var(--primary-dark);
        }

        .btn-versions {
            background-color: #e0e0e0;
            color: #9e9e9e;
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            font-weight: bold;
            cursor: not-allowed;
            position: relative;
        }

        /* تلميح أن الزر مقفل */
        .btn-versions::after {
            content: " 🔒";
        }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            font-size: 13px;
            margin-top: 50px;
            border-top: 1px solid #e0e0e0;
            background: var(--white);
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="navbar">
            <a href="#" class="logo" onclick="showHome()">apk<span>mh</span></a>
            <div class="search-bar">
                <input type="text" placeholder="ابحث عن تطبيق أو لعبة...">
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <div class="container">
        
        <!-- صفحة الرئيسية (عرض التطبيقات) -->
        <div id="home-view">
            <h2 class="section-title">الألعاب والتطبيقات المميزة</h2>
            <div class="apps-grid">
                <!-- بطاقة لعبة The bear butcher -->
                <div class="app-card" onclick="showGameDetails()">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRk_Ww6P5Wk0K9RzX4z7sU0Q6X6t1Q6t1Q6tQ&s" alt="The bear butcher" id="card-img">
                    <!-- ملاحظة: تم استخدام رابط صورة افتراضي أو يمكنك استبداله برابط صورتك المرفقة مباشرة -->
                    <h3>The bear butcher</h3>
                    <p>رعب ومغامرات v1.0.0</p>
                </div>
            </div>
        </div>

        <!-- صفحة معلومات اللعبة -->
        <div id="details-view" class="game-details">
            <button class="back-btn" onclick="showHome()">← العودة للرئيسية</button>
            <div class="game-header">
                <!-- استخدام الصورة المرفقة في تفاصيل اللعبة -->
                <img src="data:image/jpeg;base64,...(صورة الدب الدموي)..." alt="The bear butcher" id="detail-img">
                <div class="game-info">
                    <h1 id="game-title">The bear butcher</h1>
                    <p>الإصدار: 1.0.0 | الحجم: 85 MB | بواسطة: APKMH Studio</p>
                    <p>لعبة رعب وإثارة، حاول الهروب من الجزار المخيف في بيئة مظلمة ومرعبة.</p>
                    
                    <div class="action-buttons">
                        <!-- زر التحميل المباشر إلى Mediafire -->
                        <a href="https://www.mediafire.com/file/i25kbjwn3z1gdiv/bearbutcherhorrorescape-v1.0.0-1.apk/file" target="_blank" class="btn-download">Download APK</a>
                        <!-- زر الإصدارات المقفل -->
                        <button class="btn-versions" disabled>Versions</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- الفوتر -->
    <footer>
        <p>&copy; 2026 apkmh. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- سكود بسيط للتنقل بين الصفحة الرئيسية وصفحة اللعبة -->
    <script>
        // لضمان عمل الصورة المرفقة في الكود المحلي، قمنا بتعريفها أو يمكنك وضع رابط صورتك هنا مباشرة
        const gameImageSrc = "95216.jpg"; // اسم الصورة المرفقة
        document.getElementById('card-img').src = gameImageSrc;
        document.getElementById('detail-img').src = gameImageSrc;

        function showGameDetails() {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('details-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function showHome() {
            document.getElementById('details-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
